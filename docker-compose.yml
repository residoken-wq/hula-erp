version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hula_db
    restart: always
    environment:
      POSTGRES_USER: hula_user
      POSTGRES_PASSWORD: hula_password
      POSTGRES_DB: hula_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hula_user -d hula_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: hula_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: hula_user
      DB_PASSWORD: hula_password
      DB_DATABASE: hula_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src  # Backend cần map src để dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hula_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app
    # TUYỆT ĐỐI KHÔNG DÙNG VOLUMES Ở ĐÂY để tránh map nhầm code

volumes:
  postgres_data: