version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hula_db
    restart: always
    environment:
      POSTGRES_USER: hula_user
      POSTGRES_PASSWORD: hula_password
      POSTGRES_DB: hula_db
    ports:
      - "5432:5432"
    volumes:
      # Map volume để giữ dữ liệu
      - postgres_data:/var/lib/postgresql/data
    
    # --- HEALTHCHECK: Đảm bảo DB sống mới cho App chạy ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hula_user -d hula_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    # ---------------------------------------------------

  app:
    build: .
    container_name: hula_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: hula_user
      DB_PASSWORD: hula_password
      DB_DATABASE: hula_db
    
    # --- DEPENDS_ON: Chờ DB Healthcheck OK ---
    depends_on:
      db:
        condition: service_healthy
    # -----------------------------------------
    
    volumes:
      - ./src:/app/src

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hula_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app

# --- KHAI BÁO VOLUME (Ghi nhớ phần này) ---
volumes:
  postgres_data: