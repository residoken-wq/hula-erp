version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hula_db
    restart: always
    environment:
      POSTGRES_USER: hula_user
      POSTGRES_PASSWORD: hula_password
      POSTGRES_DB: hula_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    # --- CẬP NHẬT HEALTHCHECK: Tăng thời gian chờ ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hula_user -d hula_db"]
      interval: 10s  # Kiểm tra mỗi 10 giây (Thay vì 5s)
      timeout: 5s
      retries: 10    # Thử lại 10 lần (Tổng cộng chờ ~100 giây)
    # ------------------------------------------------

  app:
    build: .
    container_name: hula_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: hula_user
      DB_PASSWORD: hula_password
      DB_DATABASE: hula_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  frontend:
    build:
      context: ./frontend      # <--- SỬA DÒNG NÀY: Trỏ vào thư mục frontend
      dockerfile: Dockerfile   # <--- SỬA DÒNG NÀY: Tên file là Dockerfile (không phải Dockerfile.frontend)
    container_name: hula_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data: