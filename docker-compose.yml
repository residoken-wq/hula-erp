version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hula_db
    restart: always
    environment:
      POSTGRES_USER: hula_user
      POSTGRES_PASSWORD: hula_password
      POSTGRES_DB: hula_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hula_user -d hula_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: hula_app
    restart: always
    command: npm run start:dev # Chạy chế độ Dev (Hot Reload)
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: hula_user
      DB_PASSWORD: hula_password
      DB_DATABASE: hula_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mapping source code gốc vào container (QUAN TRỌNG cho Hot Reload)
      - ./src:/app/src 
      # Mapping dist và node_modules để tăng tốc Rebuild
      - ./dist:/app/dist
      - /app/node_modules
      # Mapping tsconfig.json để NestJS biết cách biên dịch
      - ./tsconfig.json:/app/tsconfig.json
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hula_frontend
    restart: always
    # FIX: Map cổng Dev Server (thường là 5173 hoặc 3000) sang cổng 80 của host
    ports:
      - "80:5173" # Giả định Vite chạy cổng 5173
    depends_on:
      - app
    volumes:
      # QUAN TRỌNG: Mapping Source Code để HMR hoạt động
      - ./frontend/src:/app/src 
      - ./frontend/package.json:/app/package.json
      # Không cache node_modules từ host
      - /app/node_modules

volumes:
  postgres_data: