<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1260" viewBox="0 0 1400 1260"><g font-family="DejaVu Sans,sans-serif"><rect x="0" y="0" width="1400" height="1260" rx="0" fill="#F6F8F5" stroke="none"/><text x="64" y="64" font-size="34" fill="#193E3C" font-weight="700">HULA · MỘT NGÔI TRƯỜNG, BA GÓC NHÌN</text><text x="64" y="104" font-size="21" fill="#56706C" font-weight="400">Chọn vai → đi vào phòng → tương tác cùng sản phẩm → gặp nhau ở phòng bàn giao</text><rect x="595" y="360" width="210" height="810" rx="24" fill="#E5ECE6" stroke="none"/><text x="622" y="1127" font-size="23" fill="#193E3C" font-weight="700">LỐI VÀO</text><rect x="455" y="152" width="490" height="196" rx="20" fill="#E0F0EA" stroke="#B7D9CC"/><text x="480" y="190" font-size="27" fill="#193E3C" font-weight="700">R7 · PHÒNG ĐÓN BÉ</text><text x="480" y="226" font-size="23" fill="#193E3C" font-weight="400">Cô An · Mẹ Linh · Bé Mây</text><text x="480" y="264" font-size="22" fill="#193E3C" font-weight="400">Kiểm nhãn → trao túi → nhận túi</text><text x="480" y="306" font-size="19" fill="#56706C" font-weight="400">NPC động · camera theo vai</text><path d="M700 348V1080" stroke="#94B4A6" stroke-width="3" stroke-dasharray="8 10"/><rect x="64" y="400" width="480" height="190" rx="20" fill="white" stroke="#DBE5DE"/><rect x="64" y="400" width="480" height="60" rx="20" fill="#EDE6F5" stroke="none"/><text x="86" y="441" font-size="26" fill="#193E3C" font-weight="700">R5 · TÚI BẢO QUẢN</text><text x="86" y="500" font-size="20" fill="#193E3C" font-weight="400">5 kiểu túi · xem quai / khóa / nhãn</text><text x="86" y="538" font-size="20" fill="#193E3C" font-weight="400">Cất đúng ô, lấy lại cùng chiếc túi</text><rect x="856" y="400" width="480" height="190" rx="20" fill="white" stroke="#DBE5DE"/><rect x="856" y="400" width="480" height="60" rx="20" fill="#DFF0EB" stroke="none"/><text x="878" y="441" font-size="26" fill="#193E3C" font-weight="700">R6 · LỚP PHỐI HỢP</text><text x="878" y="500" font-size="20" fill="#193E3C" font-weight="400">Đủ 5 nhóm sản phẩm trong một lớp</text><text x="878" y="538" font-size="20" fill="#193E3C" font-weight="400">Phối màu đúng dòng, giữ trạng thái</text><path d="M544 496H595 M805 496H856" stroke="#087F8C" stroke-width="8"/><rect x="64" y="640" width="480" height="190" rx="20" fill="white" stroke="#DBE5DE"/><rect x="64" y="640" width="480" height="60" rx="20" fill="#FFF0D6" stroke="none"/><text x="86" y="681" font-size="26" fill="#193E3C" font-weight="700">R3 · NỆM FOAM</text><text x="86" y="740" font-size="20" fill="#193E3C" font-weight="400">Gấp 4 đoạn → cất lên kệ → lấy ra</text><text x="86" y="778" font-size="20" fill="#193E3C" font-weight="400">Loại cơ bản có hành động riêng</text><rect x="856" y="640" width="480" height="190" rx="20" fill="white" stroke="#DBE5DE"/><rect x="856" y="640" width="480" height="60" rx="20" fill="#F8E6EB" stroke="none"/><text x="878" y="681" font-size="26" fill="#193E3C" font-weight="700">R4 · TÚI NGỦ</text><text x="878" y="740" font-size="20" fill="#193E3C" font-weight="400">Tiêu chuẩn / nâng cao khác cấu tạo</text><text x="878" y="778" font-size="20" fill="#193E3C" font-weight="400">Xem phần chăn, đổi màu dòng Cara</text><path d="M544 736H595 M805 736H856" stroke="#087F8C" stroke-width="8"/><rect x="64" y="880" width="480" height="190" rx="20" fill="white" stroke="#DBE5DE"/><rect x="64" y="880" width="480" height="60" rx="20" fill="#DFF0F7" stroke="none"/><text x="86" y="921" font-size="26" fill="#193E3C" font-weight="700">R1 · COTTON CARA</text><text x="86" y="980" font-size="20" fill="#193E3C" font-weight="400">6 màu · một bộ hoặc cùng dòng</text><text x="86" y="1018" font-size="20" fill="#193E3C" font-weight="400">Lại gần đúng bộ, giữ viền và chần</text><rect x="856" y="880" width="480" height="190" rx="20" fill="white" stroke="#DBE5DE"/><rect x="856" y="880" width="480" height="60" rx="20" fill="#EBEDF9" stroke="none"/><text x="878" y="921" font-size="26" fill="#193E3C" font-weight="700">R2 · SATIN</text><text x="878" y="980" font-size="20" fill="#193E3C" font-weight="400">Xem đúng vật liệu và kích thước</text><text x="878" y="1018" font-size="20" fill="#193E3C" font-weight="400">Chỉ dùng phối màu có nguồn</text><path d="M544 976H595 M805 976H856" stroke="#087F8C" stroke-width="8"/><text x="69" y="1158" font-size="22" fill="#193E3C" font-weight="600">Vai chọn lúc bắt đầu:</text><text x="69" y="1194" font-size="21" fill="#193E3C" font-weight="400">Cô An 1,55 m · Mẹ Linh 1,60 m · Bé Mây 0,95 m</text><text x="849" y="1158" font-size="23" fill="#193E3C" font-weight="600">Tuyến nhanh: R1 → R6 → R7</text><text x="849" y="1194" font-size="20" fill="#193E3C" font-weight="400">Mọi phòng đều có lối về hành lang</text><text x="64" y="1236" font-size="18" fill="#56706C" font-weight="400">Sơ đồ ý tưởng, không theo tỷ lệ xây dựng. Phòng R1–R6 không có người trong nền.</text></g></svg>