version: '3.8'

services:
  # ============================================
  # HULA WEBSITE - Website công khai
  # ============================================
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://erp.nemmamnon.com
    container_name: hula_website
    restart: always
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=nemmamnon.com,www.nemmamnon.com
      - VIRTUAL_PORT=3000
      - API_URL=http://hula_app:3000
    networks:
      - hula_network
      - proxy_net

  # ============================================
  # HULA CMS - Quản trị nội dung (Ant Design Pro)
  # ============================================
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: hula_cms
    restart: always
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=cms.nemmamnon.com
      - VIRTUAL_PORT=3000
      - API_URL=http://hula_app:3000
      - NEXT_PUBLIC_API_URL=https://erp.nemmamnon.com
    networks:
      - hula_network
      - proxy_net

networks:
  # Network chung với ERP containers (hula_app, hula_db)
  hula_network:
    external: true
    name: hula-erp_default # Tên network mặc định của hula-erp docker-compose
  proxy_net:
    external: true # Nginx Proxy Manager network
